                                    <BarChart data={charts.vix_distribution}>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#334155" strokeOpacity={0.3} />
                                        <XAxis dataKey="range" stroke="#94a3b8" tick={{fontSize: 12}} />
                                        <YAxis 
                                            stroke="#94a3b8" 
                                            tick={{fontSize: 12}}
                                            label={{ value: 'Days', angle: -90, position: 'insideLeft', fill: '#94a3b8' }} 
                                        />
                                        <Tooltip 
                                            contentStyle={{
                                                backgroundColor: '#1e293b', 
                                                border: '1px solid #475569', 
                                                borderRadius: '10px'
                                            }}
                                            formatter={(value, name) => {
                                                if (name === 'days') return [value, 'Days'];
                                                return [value, name];
                                            }}
                                        />
                                        <Bar dataKey="days" fill="#06b6d4" radius={[8, 8, 0, 0]} />
                                    </BarChart>
                                </ResponsiveContainer>
                                <div className="mt-6 p-4 bg-cyan-900/20 border border-cyan-700/30 rounded-lg">
                                    <p className="text-sm text-cyan-300">
                                        <strong>Strategy activates</strong> when VIX &gt; {config.vix_threshold} (rightmost bars)
                                    </p>
                                </div>
                            </div>

                            {/* Drawdown Chart */}
                            <div className="bg-slate-800/50 backdrop-blur-sm rounded-2xl p-8 border border-slate-700/50 shadow-2xl">
                                <h3 className="text-2xl font-bold mb-6 text-cyan-300">📉 Drawdown Comparison</h3>
                                <ResponsiveContainer width="100%" height={320}>
                                    <LineChart data={drawdownData}>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#334155" strokeOpacity={0.3} />
                                        <XAxis 
                                            dataKey="date" 
                                            stroke="#94a3b8"
                                            tick={{fontSize: 11}}
                                            tickFormatter={(value) => new Date(value).toLocaleDateString('en-US', {month: 'short', year: '2-digit'})}
                                        />
                                        <YAxis 
                                            stroke="#94a3b8"
                                            tick={{fontSize: 12}}
                                            tickFormatter={(value) => `${value}%`}
                                        />
                                        <Tooltip 
                                            contentStyle={{
                                                backgroundColor: '#1e293b', 
                                                border: '1px solid #475569', 
                                                borderRadius: '10px'
                                            }}
                                            formatter={(value, name) => {
                                                const label = name === 'spy' ? 'Buy & Hold' : 'Strategy';
                                                return [`${value.toFixed(2)}%`, label];
                                            }}
                                        />
                                        <Legend formatter={(value) => value === 'spy' ? 'Buy & Hold' : 'Strategy'} />
                                        <Line type="monotone" dataKey="spy" stroke="#94a3b8" strokeWidth={2.5} dot={false} />
                                        <Line type="monotone" dataKey="strategy" stroke="#ef4444" strokeWidth={2.5} dot={false} />
                                    </LineChart>
                                </ResponsiveContainer>
                                <div className="mt-6 p-4 bg-red-900/20 border border-red-700/30 rounded-lg">
                                    <p className="text-sm text-red-300">
                                        Lower drawdown = <strong>better risk management</strong>
                                    </p>
                                </div>
                            </div>

                        </div>

                        {/* Monthly Returns */}
                        <div className="bg-slate-800/50 backdrop-blur-sm rounded-2xl p-8 border border-slate-700/50 shadow-2xl mb-10">
                            <h3 className="text-3xl font-bold mb-6 text-cyan-300">📅 Monthly Returns Comparison</h3>
                            <ResponsiveContainer width="100%" height={350}>
                                <BarChart data={charts.monthly.slice(-24)}>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" strokeOpacity={0.3} />
                                    <XAxis 
                                        dataKey="month" 
                                        stroke="#94a3b8"
                                        tick={{fontSize: 11}}
                                        angle={-45}
                                        textAnchor="end"
                                        height={90}
                                    />
                                    <YAxis 
                                        stroke="#94a3b8"
                                        tick={{fontSize: 12}}
                                        tickFormatter={(value) => `${value}%`}
                                    />
                                    <Tooltip 
                                        contentStyle={{
                                            backgroundColor: '#1e293b', 
                                            border: '1px solid #475569', 
                                            borderRadius: '10px'
                                        }}
                                        formatter={(value, name) => [`${value}%`, name === 'spy' ? 'SPY' : 'Strategy']}
                                    />
                                    <Legend formatter={(value) => value === 'spy' ? 'SPY Buy & Hold' : 'VIX Strategy'} />
                                    <Bar dataKey="spy" fill="#94a3b8" radius={[4, 4, 0, 0]} />
                                    <Bar dataKey="strategy" fill="#06b6d4" radius={[4, 4, 0, 0]} />
                                </BarChart>
                            </ResponsiveContainer>
                        </div>

                        {/* Footer */}
                        <div className="mt-16 text-center text-slate-500 text-sm border-t border-slate-700/50 pt-10 pb-6">
                            <p className="mb-2 text-base">⚠️ Past performance is not indicative of future results. For educational purposes only.</p>
                            <p className="text-slate-600">Built with React + Recharts + Python | Data: Mock Generated</p>
                            <p className="mt-4 text-cyan-500 font-mono">github.com/yourhandle | @yourtwitter</p>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StrategyDashboard />);
    </script>
</body>
</html>
